name: "CodeQL Analysis"

on:
  push:
    branches: [ main, develop, Improv, 'Improv-Sandbox', 'sandbox/**', 'sandbox/*', '*sandbox*', '*Sandbox*' ]
  pull_request:
    branches: [ main, develop, Improv, 'Improv-Sandbox', 'sandbox/**', 'sandbox/*', '*sandbox*', '*Sandbox*' ]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze Android Code
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Setup Android SDK Platform
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Grant Execute Permission for Gradlew
        run: test -f android/gradlew && chmod +x android/gradlew || true

      - name: Install Dependencies
        run: |
          flutter clean
          flutter doctor -v
          yes | flutter doctor --android-licenses || true
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs || true

      - name: Setup Signing Key for Build
        run: |
          mkdir -p android/app
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -genkey -v -keystore android/app/upload-keystore.jks -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          printf "storePassword=android\nkeyPassword=android\nkeyAlias=androiddebugkey\nstoreFile=upload-keystore.jks\n" > android/key.properties

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Build Android Code for CodeQL Extraction
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation 2>&1 | tee build_codeql.log

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"

      - name: Publish Errors to Job Summary
        if: failure()
        run: |
          echo "## ❌ CodeQL Build Failure Summary" >> $GITHUB_STEP_SUMMARY
          echo "Here are the compiler and build error messages:" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          if [ -f build_codeql.log ] && [ -s build_codeql.log ]; then
            tail -n 120 build_codeql.log >> $GITHUB_STEP_SUMMARY
            ANNOTATION_MSG=$(tail -n 30 build_codeql.log | tr '\r\n' ' | ' | sed 's/[^a-zA-Z0-9 ._:\/|-]/ /g' | cut -c 1-500)
            echo "::error title=CodeQL Build Error::$ANNOTATION_MSG"
          else
            echo "No build log found or failure occurred in setup." >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload CodeQL Build Failure Logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-build-failure-logs
          path: "*.log"
          if-no-files-found: ignore
          retention-days: 2
