name: Build Wallet APKs

on:
  push:
    branches: [ main, develop, Improv, 'sandbox/**' ]
  pull_request:
    branches: [ main, develop, Improv, 'sandbox/**' ]
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    name: Build & Release APKs
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          flutter doctor -v
          yes | flutter doctor --android-licenses
          flutter pub get

      - name: Setup Signing (Optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ ! -z "$KEYSTORE_BASE64" ]; then
            echo "Decoding keystore..."
            mkdir -p android/app
            echo $KEYSTORE_BASE64 | base64 --decode > android/app/upload-keystore.jks
            echo "storePassword=$KEYSTORE_PASSWORD" > android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "storeFile=upload-keystore.jks" >> android/key.properties
          else
            echo "No signing secrets found. Building unsigned APKs."
          fi

      - name: Code Generation (Build Runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Universal APK
        id: build_universal
        run: |
          echo "Building Universal (Fat) APK..."
          flutter clean
          flutter pub get
          mkdir -p build/app/outputs/symbols
          flutter build apk --obfuscate --split-debug-info=build/app/outputs/symbols --release --no-tree-shake-icons --verbose
          
          # Manually locate APK if standard path is empty
          if [ ! -f build/app/outputs/flutter-apk/app-release.apk ]; then
            echo "Standard APK path not found. Searching in android/app/build/outputs/apk/release/..."
            mkdir -p build/app/outputs/flutter-apk
            cp android/app/build/outputs/apk/release/app-release.apk build/app/outputs/flutter-apk/app-release.apk || echo "APK not found in android/app path either."
          fi

      - name: Build Split APKs
        run: |
          echo "Building Split-ABI APKs..."
          flutter build apk --split-per-abi --obfuscate --split-debug-info=build/app/outputs/symbols --release --no-tree-shake-icons --verbose
          
          # Manually locate Split APKs
          if [ ! -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
             echo "Split APKs not found in standard path. Searching in android/app/build/outputs/apk/release/..."
             cp android/app/build/outputs/apk/release/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/app-arm64-v8a-release.apk || true
             cp android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk || true
             cp android/app/build/outputs/apk/release/app-x86_64-release.apk build/app/outputs/flutter-apk/app-x86_64-release.apk || true
          fi

      - name: Process & Rename APKs
        if: success()
        run: |
          mkdir -p build/app/outputs/final-apks
          
          # Check for Universal APK
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/final-apks/wallet-universal.apk
          fi
          
          # Check for Split APKs
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/final-apks/wallet-arm64-v8a.apk
          fi
          
          if [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ]; then
            mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/final-apks/wallet-arm-v7a.apk
          fi

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Wallet-APKs
          path: build/app/outputs/final-apks/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Debug Symbols
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Debug-Symbols
          path: build/app/outputs/symbols/*
          retention-days: 7
