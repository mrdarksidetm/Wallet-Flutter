name: Build Wallet APKs

on:
  push:
    branches: [ main, develop, Improv, 'sandbox/**' ]
  pull_request:
    branches: [ main, develop, Improv, 'sandbox/**' ]
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    name: Build & Release APKs
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          flutter doctor -v
          yes | flutter doctor --android-licenses || true
          flutter pub get

      - name: Setup Signing (Optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p android/app
          mkdir -p ~/.android
          
          # Always generate default debug keystore so fallback debug signing never fails
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          else
            echo "No signing secrets found. Creating CI fallback keystore."
            keytool -genkey -v -keystore android/app/upload-keystore.jks -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            printf "storePassword=android\nkeyPassword=android\nkeyAlias=androiddebugkey\nstoreFile=upload-keystore.jks\n" > android/key.properties
          fi

      - name: Code Generation (Build Runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Prepare Output Directories
        run: |
          mkdir -p build/app/outputs/symbols
          mkdir -p build/app/outputs/final-apks

      - name: Build Universal APK
        run: |
          echo "Building Universal (Fat) APK..."
          flutter build apk --obfuscate --split-debug-info=build/app/outputs/symbols --release --no-tree-shake-icons --verbose --android-skip-build-dependency-validation
          
          # Immediately preserve universal APK before split-abi build overwrites outputs
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/final-apks/wallet-universal.apk
          elif [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk build/app/outputs/final-apks/wallet-universal.apk
          elif [ -f build/app/outputs/flutter-apk/app-release-unsigned.apk ]; then
            cp build/app/outputs/flutter-apk/app-release-unsigned.apk build/app/outputs/final-apks/wallet-universal.apk
          fi

      - name: Build Split APKs
        run: |
          echo "Building Split-ABI APKs..."
          flutter build apk --split-per-abi --obfuscate --split-debug-info=build/app/outputs/symbols --release --no-tree-shake-icons --verbose --android-skip-build-dependency-validation
          
          # Preserve split APKs
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/final-apks/wallet-arm64-v8a.apk
          elif [ -f android/app/build/outputs/apk/release/app-arm64-v8a-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-arm64-v8a-release.apk build/app/outputs/final-apks/wallet-arm64-v8a.apk
          fi
          
          if [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/final-apks/wallet-arm-v7a.apk
          elif [ -f android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk build/app/outputs/final-apks/wallet-arm-v7a.apk
          fi

          if [ -f build/app/outputs/flutter-apk/app-x86_64-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-x86_64-release.apk build/app/outputs/final-apks/wallet-x86_64.apk
          elif [ -f android/app/build/outputs/apk/release/app-x86_64-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-x86_64-release.apk build/app/outputs/final-apks/wallet-x86_64.apk
          fi

      - name: Verify Output APKs
        run: |
          echo "Generated APKs in final-apks:"
          ls -lah build/app/outputs/final-apks/
          if [ ! -f build/app/outputs/final-apks/wallet-universal.apk ] && [ ! -f build/app/outputs/final-apks/wallet-arm64-v8a.apk ]; then
            echo "::error::No APKs were generated in final-apks!"
            exit 1
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Wallet-APKs
          path: build/app/outputs/final-apks/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Debug Symbols
        uses: actions/upload-artifact@v4
        with:
          name: Debug-Symbols
          path: build/app/outputs/symbols/*
          if-no-files-found: warn
          retention-days: 7
