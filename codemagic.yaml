workflows:
  android-release:
    name: Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    # 1. ENVIRONMENT CONFIGURATION
    environment:
      groups:
        - android-signing 
      flutter: stable
      java: 21

    # 2. CACHING
    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/.gradle

    # 3. BUILD SCRIPTS
    scripts:
      - name: Set up Key Properties and Keystore
        script: |
          # Create key.properties file for Gradle
          cat <<EOF > android/key.properties
          storePassword=$F_STORE_PASSWORD
          keyPassword=$F_KEY_PASSWORD
          keyAlias=$F_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          
          # Decode the Base64 keystore
          echo "$F_KEYSTORE" | base64 --decode > android/app/upload-keystore.jks

      - name: Initialize Flutter
        script: |
          flutter doctor -v
          flutter precache

      - name: Get Dependencies
        script: |
          flutter pub get

      - name: Run Code Generation
        script: |
          dart run build_runner build --delete-conflicting-outputs

      - name: Static Analysis
        script: |
          flutter analyze

      - name: Build Android Release APKs
        script: |
          mkdir -p build/artifacts
          
          # Single build command to generate both split and universal APKs
          flutter build apk --release --split-per-abi --no-tree-shake-icons
          
          # Use find to locate artifacts regardless of path variations
          find build -name "app-armeabi-v7a-release.apk" -exec cp {} build/artifacts/Wallet-armeabi-v7a.apk \;
          find build -name "app-arm64-v8a-release.apk" -exec cp {} build/artifacts/Wallet-arm64-v8a.apk \;
          find build -name "app-release.apk" -exec cp {} build/artifacts/Wallet-universal.apk \;
          
          # Final check
          ls -R build/artifacts/

    # 4. ARTIFACTS COLLECTION
    artifacts:
      - build/artifacts/*.apk

    # 5. PUBLISHING / NOTIFICATIONS
    publishing:
      email:
        recipients:
          - ajukr99901@gmail.com
